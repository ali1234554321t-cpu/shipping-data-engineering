
version: 2

sources:
  - name: shipping_source
    description: "Operational shipment events and real US port capacity observations."
    database: shipping_db
    schema: public

    tables:
      - name: shipment_events
        description: "Shipment status events generated by the shipping pipeline."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

          - name: shipment_id
            data_tests:
              - not_null

          - name: status
            data_tests:
              - not_null

          - name: event_time
            data_tests:
              - not_null

      - name: port_capacity
        description: "Bureau of Transportation Statistics port and logistics observations."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

          - name: source_id
            data_tests:
              - unique

          - name: observation_date
            data_tests:
              - not_null

          - name: indicator
            data_tests:
              - not_null

      - name: gold_shipment_summary
        description: "Gold-level shipment summaries loaded from PySpark."
        columns:
          - name: summary_type
            data_tests:
              - not_null

          - name: shipment_count
            data_tests:
              - not_null

      - name: gold_port_capacity_summary
        description: "Gold-level monthly and annual port capacity summaries."
        columns:
          - name: indicator
            data_tests:
              - not_null

          - name: summary_type
            data_tests:
              - not_null

          - name: record_count
            data_tests:
              - not_null
